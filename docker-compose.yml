version: "3.9"

networks:
  axonri_net:
    driver: bridge

volumes:
  qdrant_data:
  axonri_data:

services:

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: axonri_qdrant
    restart: unless-stopped
    networks: [axonri_net]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: /data/axonri-workspace
      dockerfile: axonri-banking/Dockerfile
    container_name: axonri_app
    restart: unless-stopped
    networks: [axonri_net]
    ports:
      - "8000:8000"
    volumes:
      - axonri_data:/data
      - /data/axonri-workspace/axonri-core:/axonri-core
      - /data/axonri-workspace/axonri-core/axonri_core:/axonri-core/axonri_core
      - /data/axonri-workspace/axonri-banking/app:/app/app
      - /data/axonri-workspace/axonri-banking/static:/app/static
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_HOST_DETECT: "auto"
      LLM_HOST: "host.docker.internal"
      LLM_PORT: "8080"
      LLM_MODEL: "qwen3-1.7b"
      LLM_BACKEND: "llamacpp"
      QDRANT_HOST: "axonri_qdrant"
      QDRANT_PORT: "6333"
      DB_PATH: "/data/axonri.db"
      CORPUS_DIR: "/data/corpus"
      VECTORS_DIR: "/data/vectors"
      LOG_DIR: "/data/logs"
      HF_HOME: "/data/models"
      SENTENCE_TRANSFORMERS_HOME: "/data/models"
      WHISPER_MODEL: "small"
      AXONRI_ADMIN_PASSWORD: "axonri123"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/axonri-core"
    command: >
      sh -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info"